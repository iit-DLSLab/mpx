[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "mpx"
version = "0.1"
description = "Model Predictive Control in JAX"
authors = [
    { name = "Amatucci Lorenzo" }
]
license = { text = "BSD-3-Clause" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jax[cuda12]",
    "mujoco<3.10",
    "mujoco-mjx<3.10",
    "trajax @ git+https://github.com/google/trajax",
    "qpax",
    "flax",
    "warp-lang<1.13"
]

[project.urls]
Homepage = "https://github.com/iit-DLSLab/mpx"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pixi.workspace]
channels = ["conda-forge", "nvidia", "https://prefix.dev/robostack-humble"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = ">=3.10"
jax = "*"
mujoco = "<3.10"
mujoco-mjx = "<3.10"
ros-humble-desktop = "*"
ros-humble-rmw-cyclonedds-cpp = "*"
ros-humble-rosidl-generator-dds-idl = "*"
ros-humble-plotjuggler-ros = "*"
cmake = "*"
make = "*"
ninja = "*"
colcon-common-extensions = "*"
catkin_tools = "*"
rosdep = "*"
compilers = "*"
jaxlib = { version = "*", build = "*cuda*" }
"cuda-nvcc" = "*"

[tool.pixi.system-requirements]
cuda = "12"

[tool.pixi.pypi-dependencies]
trajax = { git = "https://github.com/google/trajax" }
mpx = { path = ".", editable = true }
readchar = "*"
warp-lang = "<1.13"

[tool.pixi.environments]
default = { solve-group = "default" }
